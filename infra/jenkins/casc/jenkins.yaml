jenkins:
  systemMessage: "Local DevSecOps lab. Do not expose publicly."
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users: []

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  remotingSecurity:
    enabled: true

unclassified:
  gitHubPluginConfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://github.com"
        credentialsId: "github-token"
        manageHooks: true
